  sandbox-context-gateway:
    name: openleek-sandbox-context-gateway
    internal: true
    attachable: true
    ipam: { config: [{ subnet: "${OPENLEEK_SANDBOX_CONTEXT_GATEWAY_SUBNET:-10.240.83.0/24}" }] }
  docker-control:
