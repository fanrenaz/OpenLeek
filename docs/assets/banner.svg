<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06d6a0"/>
      <stop offset="50%" style="stop-color:#118ab2"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  
  <!-- Candlestick chart decoration (left) -->
  <g opacity="0.3">
    <!-- Green candles -->
    <rect x="60" y="90" width="8" height="40" fill="#06d6a0" rx="1"/>
    <line x1="64" y1="85" x2="64" y2="135" stroke="#06d6a0" stroke-width="1.5"/>
    <rect x="80" y="70" width="8" height="50" fill="#06d6a0" rx="1"/>
    <line x1="84" y1="60" x2="84" y2="125" stroke="#06d6a0" stroke-width="1.5"/>
    <!-- Red candles -->
    <rect x="100" y="80" width="8" height="35" fill="#ef4444" rx="1"/>
    <line x1="104" y1="75" x2="104" y2="120" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="120" y="95" width="8" height="30" fill="#ef4444" rx="1"/>
    <line x1="124" y1="90" x2="124" y2="130" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Green candles -->
    <rect x="140" y="75" width="8" height="45" fill="#06d6a0" rx="1"/>
    <line x1="144" y1="65" x2="144" y2="125" stroke="#06d6a0" stroke-width="1.5"/>
    <rect x="160" y="60" width="8" height="55" fill="#06d6a0" rx="1"/>
    <line x1="164" y1="50" x2="164" y2="120" stroke="#06d6a0" stroke-width="1.5"/>
  </g>
  
  <!-- Network graph decoration (right) -->
  <g opacity="0.3">
    <circle cx="650" cy="80" r="6" fill="#06d6a0"/>
    <circle cx="690" cy="110" r="4" fill="#118ab2"/>
    <circle cx="720" cy="70" r="5" fill="#7c3aed"/>
    <circle cx="740" cy="120" r="4" fill="#f59e0b"/>
    <circle cx="670" cy="130" r="5" fill="#06d6a0"/>
    <circle cx="710" cy="140" r="3" fill="#118ab2"/>
    <line x1="650" y1="80" x2="690" y2="110" stroke="#06d6a0" stroke-width="1" opacity="0.6"/>
    <line x1="690" y1="110" x2="720" y2="70" stroke="#118ab2" stroke-width="1" opacity="0.6"/>
    <line x1="720" y1="70" x2="740" y2="120" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
    <line x1="650" y1="80" x2="670" y2="130" stroke="#06d6a0" stroke-width="1" opacity="0.6"/>
    <line x1="670" y1="130" x2="710" y2="140" stroke="#118ab2" stroke-width="1" opacity="0.6"/>
    <line x1="690" y1="110" x2="740" y2="120" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Glow line -->
  <rect x="200" y="168" width="400" height="2" rx="1" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="200" y="168" width="400" height="1.5" rx="1" fill="url(#glow)"/>
  
  <!-- Onion emoji / Logo -->
  <text x="310" y="105" font-size="48" text-anchor="middle">🧅</text>
  
  <!-- Title -->
  <text x="420" y="90" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="36" font-weight="700" fill="white" text-anchor="start" letter-spacing="-1">OpenLeek</text>
  
  <!-- Subtitle -->
  <text x="420" y="120" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8" text-anchor="start">Open Large-scale Emergent Emotion-driven marKet simulation</text>
  
  <!-- Tagline -->
  <text x="400" y="152" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">News → Social Discussion → Emotion Emergence → Trading → Market Movement</text>
</svg>
